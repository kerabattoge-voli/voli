<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KERABATTOGETV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
    height:100vh;
    overflow:hidden;
}

.container{
    display:flex;
    height:100vh;
}

.sidebar{
    width:320px;
    background:#111827;
    display:flex;
    flex-direction:column;
}

.header{
    padding:15px;
    border-bottom:1px solid #374151;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.search{
    padding:10px;
    border-bottom:1px solid #374151;
}

.channels{
    flex:1;
    overflow-y:auto;
}

.channel{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #1f2937;
}

.channel:hover{
    background:#1f2937;
}

.channel.active{
    background:#2563eb;
}

.player{
    flex:1;
    display:flex;
    flex-direction:column;
}

.video-container{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:black;
}

video{
    width:100%;
    height:100%;
}

.info{
    padding:15px;
    background:#111827;
}

@media(max-width:768px){
    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:45%;
    }

    .player{
        height:55%;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="sidebar">

        <div class="header">
            <input id="playlistUrl"
                placeholder="https://voli.my.id/vidiom3u.php?.m3u">
            <button onclick="loadPlaylist()">
                Load Playlist
            </button>
        </div>

        <div class="search">
            <input id="search"
                placeholder="Cari channel..."
                onkeyup="filterChannels()">
        </div>

        <div id="channels" class="channels"></div>

    </div>

    <div class="player">

        <div class="video-container">
            <video id="video" controls autoplay></video>
        </div>

        <div class="info">
            <h3 id="channelName">
                Belum ada channel dipilih
            </h3>
        </div>

    </div>

</div>

<script>

let allChannels = [];
let hls;

async function loadPlaylist(){

    const url = document.getElementById('playlistUrl').value.trim();

    if(!url){
        alert('Masukkan URL playlist');
        return;
    }

    try{

        const res = await fetch(url);

        const text = await res.text();

        parseM3U(text);

    }catch(err){

        alert(
            'Gagal memuat playlist. Kemungkinan CORS diblokir.'
        );

        console.error(err);

    }
}

function parseM3U(content){

    allChannels = [];

    const lines = content.split('\n');

    let currentName = '';

    for(let i=0;i<lines.length;i++){

        const line = lines[i].trim();

        if(line.startsWith('#EXTINF')){

            currentName = line.split(',').pop();

        }

        else if(
            line.startsWith('http')
        ){

            allChannels.push({
                name: currentName || 'Unknown',
                url: line
            });

        }
    }

    renderChannels(allChannels);
}

function renderChannels(channels){

    const container =
        document.getElementById('channels');

    container.innerHTML = '';

    channels.forEach(channel => {

        const div =
            document.createElement('div');

        div.className = 'channel';

        div.innerText = channel.name;

        div.onclick = () => {

            document
            .querySelectorAll('.channel')
            .forEach(c =>
                c.classList.remove('active')
            );

            div.classList.add('active');

            playChannel(channel);

        };

        container.appendChild(div);

    });
}

function filterChannels(){

    const keyword =
        document
        .getElementById('search')
        .value
        .toLowerCase();

    const filtered =
        allChannels.filter(c =>
            c.name.toLowerCase()
            .includes(keyword)
        );

    renderChannels(filtered);
}

function playChannel(channel){

    document
        .getElementById('channelName')
        .innerText = channel.name;

    const video =
        document.getElementById('video');

    if(hls){

        hls.destroy();

    }

    if(Hls.isSupported()){

        hls = new Hls();

        hls.loadSource(channel.url);

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => video.play()
        );

    }

    else if(
        video.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ){

        video.src = channel.url;

        video.play();

    }
}

</script>

</body>
</html>
